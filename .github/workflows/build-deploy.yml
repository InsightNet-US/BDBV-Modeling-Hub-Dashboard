name: Build data and deploy to GitHub Pages

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC: after the Monday 5 pm ET target-data release and any merged submissions
  workflow_dispatch:
    inputs:
      hub_branch:
        description: Hub branch to read (falls back to main if missing)
        default: main
  push:
    branches: [main]
    paths-ignore:
      - "data/**"      # pipeline-owned; the Action's own data commits (pushed with the deploy key) must not re-trigger it

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

# Always runs from main (the Pages environment only deploys the default branch; a push to the preview
# branch dispatches this workflow through preview-push.yml). Pushes are made with the DEPLOY_KEY secret
# (a write deploy key listed as a bypass actor of the main ruleset, so the data commit passes the
# pull-request-only rule). Two sources, one hub snapshot:
#   - the live dashboard at the site root: main's code, data/ built here and committed back;
#   - /preview/: the preview branch's code and its own pipeline output, gated by a test phrase.
# The preview build is fail-soft: if the branch is missing or fails to build, /preview/ is staged from
# main with a notice in its banner (status.json) and an issue labelled preview-build is opened or
# updated, then closed automatically once the branch builds again. A failure of the main build still
# fails the run.
jobs:
  build:
    # second loop guard behind paths-ignore: never run for the Action's own data commits
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'data: refresh from hub')"
    runs-on: ubuntu-latest
    env:
      HUB_BRANCH: ${{ github.event.inputs.hub_branch || 'main' }}
      HUB_DIR: ${{ github.workspace }}/hub
      ENSEMBLE_MODEL_ID: ${{ vars.ENSEMBLE_MODEL_ID }}
      # hub | auto | dashboard (empty = auto); see README, Ensemble
      ENSEMBLE_SOURCE: ${{ vars.ENSEMBLE_SOURCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                            # the branch tip at run start, not the commit pinned when the run was
                                               # queued (a dispatched run waiting behind a push run would otherwise
                                               # build stale code and have its data commit rejected)
          ssh-key: ${{ secrets.DEPLOY_KEY }}   # pushes go over SSH with the deploy key

      - name: Clone the hub (requested branch, falling back to main)
        run: |
          set -e
          if ! git clone --depth 1 --branch "$HUB_BRANCH" https://github.com/InsightNet-US/BDBV-Modeling-Hub.git hub 2>/dev/null; then
            echo "::warning::branch $HUB_BRANCH not found on the hub; using main"
            git clone --depth 1 --branch main https://github.com/InsightNet-US/BDBV-Modeling-Hub.git hub
          fi
          echo "hub at $(git -C hub rev-parse --short HEAD) ($(git -C hub rev-parse --abbrev-ref HEAD))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: python -m pytest pipeline/tests -q

      - name: Build data/
        run: python pipeline/build.py

      - name: Commit refreshed data
        if: env.HUB_BRANCH == 'main'   # never commit another hub branch's data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "data unchanged"; else
            git commit -m "data: refresh from hub $(git -C hub rev-parse --short HEAD)"
            # a rejected push means main moved while this run was building (release merged, another run's
            # data commit); the site is still deployed from this build and the next run commits again
            git push || echo "::warning::main moved during this run; data commit not pushed (the next run will refresh it)"
          fi

      # ---- preview branch (fail-soft from here to the assembly) ----
      - name: Look for the preview branch
        id: pvref
        run: |
          if git ls-remote --exit-code --heads origin preview >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::no preview branch; /preview/ will be staged from main"; fi

      - name: Check out the preview branch
        if: steps.pvref.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: preview
          path: _pv

      - name: Build the preview branch (its tests and pipeline, same hub snapshot)
        id: pvbuild
        if: steps.pvref.outputs.exists == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          {
            echo "preview branch at $(git -C _pv rev-parse --short HEAD)"
            pip install -q -r _pv/pipeline/requirements.txt
            grep -q 'name="bdbv-preview" content=""' _pv/index.html || { echo "index.html on the preview branch lacks the bdbv-preview marker"; exit 1; }
            cd _pv && python -m pytest pipeline/tests -q && python pipeline/build.py
          } 2>&1 | tee "$GITHUB_WORKSPACE/preview-build.log"

      - name: Assemble site (live root + gated preview copy) and write preview/status.json
        env:
          PREVIEW_PASSPHRASE: ${{ vars.PREVIEW_PASSPHRASE || vars.MOCK_PASSPHRASE || 'testme' }}
          PV_EXISTS: ${{ steps.pvref.outputs.exists }}
          PV_OUTCOME: ${{ steps.pvbuild.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          root_sha=$(git rev-parse --short HEAD)
          if [ "$PV_OUTCOME" = "success" ]; then
            pv_sha=$(git -C _pv rev-parse --short HEAD)
            scripts/assemble-site.sh "$GITHUB_WORKSPACE/_site" "$root_sha" "$GITHUB_WORKSPACE/_pv" "$pv_sha"
            reason=""
          else
            scripts/assemble-site.sh "$GITHUB_WORKSPACE/_site" "$root_sha"
            pv_sha=""
            if [ "$PV_EXISTS" = "true" ]; then reason="build failed"; else reason="no preview branch"; fi
          fi
          python3 - "$reason" "$pv_sha" "$RUN_URL" <<'EOF'
          import json, sys, datetime
          reason, sha, url = sys.argv[1:4]
          json.dump({"ok": not reason, "source": "preview" if not reason else "main", "branch": "preview",
                     "commit": sha or None, "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "run_url": url, "reason": reason or None}, open("_site/preview/status.json", "w"))
          EOF
          echo "preview status: $(cat _site/preview/status.json)"

      - name: Alert on a failed preview build (issue labelled preview-build), or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PV_OUTCOME: ${{ steps.pvbuild.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/preview-alert.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
