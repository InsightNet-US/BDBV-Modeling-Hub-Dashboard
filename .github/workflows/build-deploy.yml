name: Build data and deploy to GitHub Pages

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC: after the Monday 5 pm ET target-data release and any merged submissions
  workflow_dispatch:
    inputs:
      hub_branch:
        description: Hub branch to read (falls back to main if missing)
        default: main
  push:
    branches: [main]
    paths-ignore:
      - "data/observed/**"
      - "data/rounds/**"
      - "data/manifest.json"
      - "data/models.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

# One build from the hub checkout (data/ committed to this repo), staged twice by scripts/assemble-site.sh:
# the live dashboard at the site root and a copy at /preview/ with the same data where features under
# development are switched on (gated by a test phrase).
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUB_BRANCH: ${{ github.event.inputs.hub_branch || 'main' }}
      HUB_DIR: ${{ github.workspace }}/hub
      ENSEMBLE_MODEL_ID: ${{ vars.ENSEMBLE_MODEL_ID }}
      # hub | auto | dashboard (empty = auto); see README, Ensemble
      ENSEMBLE_SOURCE: ${{ vars.ENSEMBLE_SOURCE }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone the hub (requested branch, falling back to main)
        run: |
          set -e
          if ! git clone --depth 1 --branch "$HUB_BRANCH" https://github.com/InsightNet-US/BDBV-Modeling-Hub.git hub 2>/dev/null; then
            echo "::warning::branch $HUB_BRANCH not found on the hub; using main"
            git clone --depth 1 --branch main https://github.com/InsightNet-US/BDBV-Modeling-Hub.git hub
          fi
          echo "hub at $(git -C hub rev-parse --short HEAD) ($(git -C hub rev-parse --abbrev-ref HEAD))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: python -m pytest pipeline/tests -q

      - name: Build data/
        run: python pipeline/build.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "data unchanged"; else
            git commit -m "data: refresh from hub $(git -C hub rev-parse --short HEAD)"
            git push
          fi

      - name: Assemble site (live root + gated preview copy)
        env:
          PREVIEW_PASSPHRASE: ${{ vars.PREVIEW_PASSPHRASE || vars.MOCK_PASSPHRASE || 'testme' }}
        run: scripts/assemble-site.sh "${{ github.workspace }}/_site" "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
