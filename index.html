<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BDBV Modeling Hub — nowcasts and forecasts</title>
<meta name="description" content="Nowcasts and short-term forecasts of weekly confirmed Bundibugyo virus disease cases by province, from the BDBV Modeling Hub." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="assets/style.css?v=dev" />
</head>
<body>
<header>
  <h1>BDBV Modeling Hub <span>· nowcasts &amp; forecasts of weekly confirmed cases</span></h1>
  <span class="badge hidden" id="mockBadge" title="Model output shown here is synthetic demonstration data, not team submissions">Synthetic model output</span>
  <div class="spacer"></div>
  <div class="ctrl">
    <label for="roundSel">Reference date</label>
    <select id="roundSel"></select>
  </div>
  <div class="ctrl">
    <label for="locSel">Location</label>
    <select id="locSel"></select>
  </div>
  <div class="ctrl">
    <label for="horizon">Horizon</label>
    <input id="horizon" type="range" min="0" max="3" value="3" step="1" style="width:90px" title="Forecast horizon in weeks. Week 0 is the reference week, which has not finished when forecasts are made.">
    <span>wk 0 to +<span class="horizonval" id="horizonLabel">3</span></span>
  </div>
  <div class="ctrl">
    <label class="switch" title="Overlay the most recent target data release to show backfill"><input type="checkbox" id="latestToggle" checked> Latest data</label>
  </div>
  <button class="linkbtn" id="modelsBtn" type="button">Models</button>
</header>

<div class="grid">
 <div class="left">
  <!-- TIME SERIES -->
  <section class="panel ts">
    <div class="hd">
      <h2>Weekly confirmed cases</h2>
      <span class="tlabel">Models</span>
      <div class="dd" id="tsModelDD">
        <button class="ddbtn" id="tsModelBtn" type="button">Models ▾</button>
        <div class="ddpanel" id="tsModelPanel"></div>
      </div>
      <div class="toggle small" id="rangeToggle">
        <button data-r="recent" class="active">Recent</button>
        <button data-r="full">Full outbreak</button>
      </div>
      <span class="sub" id="tsSub"></span>
      <div class="spacer"></div>
      <span class="legend" id="tsLegend"></span>
    </div>
    <div class="bd">
      <svg id="tsChart" width="100%" height="100%" preserveAspectRatio="none"></svg>
      <div class="note" id="tsEmpty" style="display:none"></div>
      <div class="wm" aria-hidden="true">Synthetic</div>
    </div>
  </section>

  <!-- CUMULATIVE -->
  <section class="panel cum">
    <div class="hd">
      <h2>Cumulative confirmed cases</h2>
      <span class="sub" id="cumSub"></span>
      <div class="spacer"></div>
      <span class="tlabel">Models</span>
      <div class="dd" id="cumModelDD">
        <button class="ddbtn" id="cumModelBtn" type="button">Models ▾</button>
        <div class="ddpanel" id="cumModelPanel"></div>
      </div>
    </div>
    <div class="bd" style="padding-top:6px">
      <svg id="cumChart" width="100%" height="200" preserveAspectRatio="none"></svg>
      <div class="wm" aria-hidden="true">Synthetic</div>
    </div>
  </section>
 </div>

  <!-- MAP -->
  <section class="panel map">
    <div class="hd">
      <h2>Provinces</h2>
      <div class="toggle small" id="metricToggle">
        <button data-m="median" class="active">Median cases</button>
        <button data-m="presence">P(≥1 case)</button>
      </div>
      <span class="tlabel">Model</span>
      <select id="mapModelSel" class="msel"></select>
      <span class="sub" id="mapSub"></span>
      <div class="spacer"></div>
      <div class="legend"><span id="legLo">0</span><span class="bar"></span><span id="legHi">1</span></div>
    </div>
    <div id="mapWrap" style="position:relative;flex:1;min-height:0;display:flex"><div id="map"></div><div class="wm" aria-hidden="true">Synthetic</div></div>
  </section>
</div>

<footer>
  <div class="footinfo">
    <span id="footProv"></span>
    <span>Boundaries: <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a> (ODbL) · <a href="https://github.com/InsightNet-US/BDBV-Modeling-Hub" target="_blank" rel="noopener">Hub repository</a></span>
  </div>
  <span class="partners" aria-label="Partners">
    <span class="partner-group" title="The BDBV Modeling Hub is a joint effort of Insight Net centers (ACCIDDA and epiEngage) and the University of Kinshasa">
      <a class="logo logo-insightnet" href="https://insightnet.us/" target="_blank" rel="noopener" title="Insight Net"><img src="assets/brand/insight-net.png" alt="Insight Net"></a>
      <a class="logo logo-accidda" href="https://accidda.org/" target="_blank" rel="noopener" title="ACCIDDA"><img src="assets/brand/accidda-white.png" alt="ACCIDDA"></a>
      <a class="logo logo-unikin" href="https://www.unikin.ac.cd/" target="_blank" rel="noopener" title="Université de Kinshasa"><img src="assets/brand/unikin.png" alt="Université de Kinshasa"></a>
    </span>
    <span class="partner-group" title="Built with the hubverse data formats and tools">
      <a class="logo logo-hubverse" href="https://hubverse.io/" target="_blank" rel="noopener" title="hubverse"><img src="assets/brand/hubverse.png" alt="hubverse"></a>
    </span>
  </span>
</footer>

<div class="tt" id="tt"></div>
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Models">
  <button class="close" id="drawerClose" aria-label="Close">×</button>
  <h2>Models in this round</h2>
  <div class="sub" id="drawerSub" style="font-size:12px;color:var(--muted)"></div>
  <div id="drawerBody"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/palette.js?v=dev"></script>
<script src="assets/timeseries.js?v=dev"></script>
<script src="assets/cumulative.js?v=dev"></script>
<script src="assets/map.js?v=dev"></script>
<script src="assets/app.js?v=dev"></script>
</body>
</html>
